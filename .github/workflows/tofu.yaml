name: tofu-plan

on:
  workflow_dispatch:
    inputs:
      oci_ad_index:
        description: "OCI Availability Domain index"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
  push:
    branches: [main]

concurrency:
  group: tofu-plan-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_INPUT: "false"
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_domain: ${{ secrets.DOMAIN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_oci_tenancy_ocid: ${{ secrets.ORC_TENANCY_OCID }}
      TF_VAR_oci_user_ocid: ${{ secrets.ORC_USER_OCID }}
      TF_VAR_oci_compartment_ocid: ${{ secrets.ORC_COMPARTMENT_OCID }}
      TF_VAR_oci_fingerprint: ${{ secrets.ORC_FINGERPRINT }}
      TF_VAR_oci_private_key: ${{ secrets.ORC_PRIVATE_KEY }}
      TF_VAR_oci_ad_index: ${{ inputs.oci_ad_index }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Init
        run: tofu init -input=false

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -input=false -no-color -out=tfplan

      - name: Show plan
        run: tofu show -no-color tfplan

      - name: Apply
        run: tofu apply -input=false -no-color tfplan
